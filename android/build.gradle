group = "com.inappify.inappify_sdk"
version = "0.2.6"

buildscript {
    ext.kotlin_version = "2.4.0"
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }

    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.1.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: "com.android.library"

// Build-time packaging is independent of the server-selected runtime marketplace.
def inappifyStore = providers.gradleProperty("inappifyStore").getOrElse("allStores")
if (!(inappifyStore in ["allStores", "myket", "bazaar", "direct"])) {
    throw new GradleException("inappifyStore must be allStores, myket, bazaar, or direct")
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.inappify.inappify_sdk"
    }

    // Needed by Material dynamic color resources generated in values-v34.
    compileSdk = 37

    defaultConfig {
        minSdk = 21
        // Select the native release variant, including its dependencies and manifest.
        missingDimensionStrategy "inappifyStore", inappifyStore
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation("com.github.InappifyLabs:kotlin-sdk:v0.2.6") {
        // Also select the variant when the host resolves transitive dependencies.
        attributes {
            attribute(
                com.android.build.api.attributes.ProductFlavorAttr.of("inappifyStore"),
                objects.named(com.android.build.api.attributes.ProductFlavorAttr, inappifyStore)
            )
        }
    }
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:$kotlin_version"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
