name: inappify_sdk
description: "Flutter SDK for Inappify purchases, entitlements, offerings, and paywalls."
version: 0.2.6
homepage: https://github.com/InappifyLabs/flutter-sdk
repository: https://github.com/InappifyLabs/flutter-sdk
issue_tracker: https://github.com/InappifyLabs/flutter-sdk/issues

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  plugin_platform_interface: ^2.1.8
  dio: ^5.11.0
  dio_web_adapter: ^2.2.1
  json_serializable: ^6.14.1
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  path_provider: ^2.1.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
flutter:
  plugin:
    platforms:
      android:
        package: com.inappify.inappify_sdk
        pluginClass: InappifySdkPlugin
      ios:
        pluginClass: InappifySdkPlugin
      web:
        pluginClass: InappifySdkWeb
        fileName: inappify_sdk_web.dart
