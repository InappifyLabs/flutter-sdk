name: SDK checks

on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare published Web provider fixture
        run: node tool/prepare_web_provider_test.mjs
      - name: Verify release versions
        shell: bash
        run: |
          python3 tool/verify_release.py
      - name: Analyze SDK and example
        run: flutter analyze --no-fatal-infos
      - name: Test SDK
        run: flutter test
      - name: Test Web bridge with published provider in Chrome
        run: flutter test --platform chrome test/web_provider_contract_browser_test.dart test/web_registration_smoke_test.dart
      - name: Test example
        working-directory: example
        run: flutter test
      - name: Compile Web example
        working-directory: example
        run: flutter build web
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Compile Android example
        working-directory: example
        run: flutter build apk --debug --target-platform=android-arm64
      - name: Test Android bridge and compile release library
        working-directory: example/android
        run: ./gradlew :inappify_sdk:testDebugUnitTest :inappify_sdk:assembleRelease
